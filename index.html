<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>簡繁轉換</title>
    <meta name="description" content="Offline Simplified ↔ Traditional Chinese converter. Runs entirely in your browser." />
    <link rel="stylesheet" href="../ipa/css/styles.css" />
    <style>
      .options-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 28px;
        margin: 12px 0 4px;
        align-items: center;
      }
      .options-group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
      }
      .options-group > span {
        font-size: var(--font-sm);
        color: var(--color-text-muted);
        margin-right: 4px;
      }
      .hint {
        font-size: var(--font-xs);
        color: var(--color-text-light);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="titles">
        <h1>簡繁轉換</h1>
        <h2>Offline Simplified ↔ Traditional Chinese</h2>
      </div>
      <button id="dark-mode-toggle" class="btn-theme" aria-label="Toggle dark mode">
        <span class="icon"></span>
      </button>
    </div>
    <hr />

    <div class="options-row">
      <div class="options-group" role="radiogroup" aria-label="Direction">
        <span>方向</span>
        <label class="form-check-inline"><input type="radio" name="direction" value="s2t" checked /> 簡 → 繁</label>
        <label class="form-check-inline"><input type="radio" name="direction" value="t2s" /> 繁 → 簡</label>
      </div>
      <div class="options-group" id="localeGroup" role="radiogroup" aria-label="Locale">
        <span>繁體變體</span>
        <label class="form-check-inline"><input type="radio" name="locale" value="t" checked /> OpenCC</label>
        <label class="form-check-inline"><input type="radio" name="locale" value="tw" /> 台灣</label>
        <label class="form-check-inline"><input type="radio" name="locale" value="twp" /> 台灣（常用詞）</label>
        <label class="form-check-inline"><input type="radio" name="locale" value="hk" /> 香港</label>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <div class="form-group">
          <label for="inputText">輸入</label>
          <textarea id="inputText" rows="12" placeholder="貼上要轉換嘅文字…"></textarea>
        </div>
      </div>
      <div class="col">
        <div class="form-group">
          <div class="label-with-controls">
            <label for="outputText">輸出</label>
            <div class="output-controls">
              <button id="copyBtn" class="btn-icon" aria-label="Copy"></button>
            </div>
          </div>
          <textarea id="outputText" rows="12" disabled></textarea>
        </div>
      </div>
    </div>
    <p class="hint">純前端 OpenCC（opencc-js），詞典已內嵌；載入後可離線使用。詞彙轉換以詞典為準，未必完美。</p>

    <footer class="footer">
      <div class="footer-bottom">
        <div class="footer-bottom-inner">
          <p>
            Power By: LOTUS FA,
            <a href="https://lotusfa.com/">lotusfa.com</a>
            · Conversion: <a href="https://github.com/BYVoid/OpenCC">OpenCC</a> /
            <a href="https://github.com/nk2028/opencc-js">opencc-js</a>
          </p>
        </div>
      </div>

      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-8952191733743650"
           data-ad-slot="7418454359"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </footer>

    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', 'UA-80492067-1', 'auto');
      ga('send', 'pageview');
    </script>

    <script type="module">
      import { svgLightMode, svgDarkMode, svgCopy, svgTick } from '../ipa/js/svg.js';
      import OpenCC from './lib/opencc-full.js';

      const toggle = document.getElementById('dark-mode-toggle');
      const iconSpan = toggle.querySelector('.icon');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        iconSpan.innerHTML = svgDarkMode;
      } else {
        iconSpan.innerHTML = svgLightMode;
      }
      toggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        iconSpan.innerHTML = isDark ? svgDarkMode : svgLightMode;
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      const inputText = document.getElementById('inputText');
      const outputText = document.getElementById('outputText');
      const copyBtn = document.getElementById('copyBtn');
      const localeGroup = document.getElementById('localeGroup');
      let converter = null;
      let debounceTimer = null;

      function selected(name) {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        return el ? el.value : null;
      }

      function rebuildConverter() {
        const direction = selected('direction') || 's2t';
        const locale = selected('locale') || 't';
        localeGroup.style.opacity = direction === 's2t' ? '1' : '0.45';
        localeGroup.querySelectorAll('input').forEach((inp) => {
          inp.disabled = direction !== 's2t';
        });
        if (direction === 's2t') {
          converter = OpenCC.Converter({ from: 'cn', to: locale });
        } else {
          // Prefer converting from the selected traditional locale when going T→S
          const from = localeGroup.querySelector('input:checked')?.value || 't';
          converter = OpenCC.Converter({ from: from === 'twp' ? 'twp' : from === 'tw' ? 'tw' : from === 'hk' ? 'hk' : 't', to: 'cn' });
        }
        convertNow();
      }

      function convertNow() {
        const text = inputText.value;
        if (!text) {
          outputText.value = '';
          return;
        }
        try {
          outputText.value = converter(text);
        } catch (e) {
          outputText.value = 'Error: ' + e.message;
        }
      }

      inputText.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(convertNow, 200);
      });
      document.querySelectorAll('input[name="direction"], input[name="locale"]').forEach((el) => {
        el.addEventListener('change', rebuildConverter);
      });

      copyBtn.innerHTML = svgCopy;
      copyBtn.addEventListener('click', () => {
        const text = outputText.value;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = svgTick;
          setTimeout(() => { copyBtn.innerHTML = svgCopy; }, 1500);
        });
      });

      rebuildConverter();
    </script>
  </body>
</html>
